# AxonOS SDK — Continuous Integration
#
# Fixes applied:
#   - cargo-deny: updated to v2 (v1 uses deprecated Node.js, GitHub blocks it)
#   - cargo-deny: fixed arguments syntax (was passing "check bans licenses sources" as single command)
#   - MSRV: pinned to 1.85.0 for reproducibility
#   - no_std: added cargo check before build for fast failure
#   - test: added no-default-features check to catch no_std regressions
#   - clippy: added no-default-features check
#   - docs: pinned toolchain to avoid nightly rustdoc breaking changes

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Tests across three host operating systems ─────────────────────────
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --features std
        run: cargo test --features std
      - name: cargo test --no-default-features
        run: cargo test --no-default-features

  # ── 2. Format check ───────────────────────────────────────────────────────
  fmt:
    name: rustfmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── 3. Clippy ─────────────────────────────────────────────────────────────
  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --features std -- -D warnings
      - run: cargo clippy --no-default-features -- -D warnings

  # ── 4. MSRV pin (1.85.0) ─────────────────────────────────────────────────
  msrv:
    name: MSRV (1.85.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --features std
      - run: cargo check --no-default-features

  # ── 5. no_std build on Cortex-M targets ──────────────────────────────────
  no-std:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf
          - thumbv8m.main-none-eabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --target ${{ matrix.target }}
        run: cargo check --target ${{ matrix.target }} --no-default-features
      - name: cargo build --target ${{ matrix.target }}
        run: cargo build --release --target ${{ matrix.target }} --no-default-features

  # ── 6. Documentation build ───────────────────────────────────────────────
  docs:
    name: docs -D rustdoc warnings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  # ── 7. Miri (UB detection on host) ───────────────────────────────────────
  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: miri test
        run: cargo miri test --features std

  # ── 8. cargo-deny (licence + advisory + bans audit) ──────────────────────
  # Updated to v2: v1 is deprecated by GitHub (Node.js 16/20 EOL).
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --advisories --bans --licenses --sources
          
