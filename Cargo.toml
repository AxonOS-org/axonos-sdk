# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "axonos-sdk"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
authors = ["Denis Yermakou <denis@axonos.org>"]
license = "Apache-2.0 OR MIT"
description = "Hardened BCI SDK — typed intent events, capability declarations, and mesh consent integration."
documentation = "https://docs.rs/axonos-sdk"
repository = "https://github.com/AxonOS-org/axonos-sdk"
homepage = "https://axonos.org"
readme = "README.md"
keywords = ["bci", "neurotech", "embedded", "consent", "no-std"]
categories = ["embedded", "no-std", "hardware-support", "science"]

[lib]
name = "axonos_sdk"
path = "src/lib.rs"

[features]
default = []

# Development-only: allows compilation without kernel ABI.
# NEVER enable in production builds.
kernel-stub = []

std = ["dep:thiserror", "alloc"]
alloc = []
serde = [
    "dep:serde",
    "dep:serde_repr",
    "heapless/serde",
]
zerocopy = ["dep:zerocopy"]

[dependencies]
thiserror = { version = "2.0", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
serde_repr = { version = "0.1", optional = true }
zerocopy = { version = "0.8", features = ["derive"], optional = true }
heapless = "0.8"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }

[[bench]]
name = "intent_throughput"
harness = false

[[example]]
name = "hello_intent"
required-features = ["std", "kernel-stub"]

[[example]]
name = "mind_cursor"
required-features = ["std", "serde", "kernel-stub"]

[[example]]
name = "focus_monitor"
required-features = ["std", "kernel-stub"]

[[example]]
name = "mesh_coupling"
required-features = ["std", "serde", "kernel-stub"]

[[example]]
name = "bare_metal_no_std"
required-features = ["kernel-stub"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
overflow-checks = true

[profile.dev]
opt-level = 1
overflow-checks = true

[profile.bench]
debug = true
lto = "fat"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "thumbv7em-none-eabihf", "thumbv8m.main-none-eabihf"]
